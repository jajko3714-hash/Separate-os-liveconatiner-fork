name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Upgraded to Node 22/24 Environment)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Create Fake Web Build Folder
        run: |
          mkdir -p dist
          cp index.html dist/
          cp script.js dist/

      - name: Initialize Capacitor iOS
        run: |
          npx cap init "CustomOS" "com.yourname.customlauncher" --web-dir=dist
          npx cap add ios

      - name: Sync Web Code
        run: npx cap sync ios

      - name: Build and Package IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO archive -archivePath App.xcarchive
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -r ../../CustomOS.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomOS-Unsigned-IPA
          path: CustomOS.ipa
